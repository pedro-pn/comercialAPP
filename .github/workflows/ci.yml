name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: comercialapp_test
          POSTGRES_USER: comercial
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U comercial -d comercialapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://comercial:ci-only-password@127.0.0.1:5432/comercialapp_test?schema=public
      TEST_DATABASE_URL: postgresql://comercial:ci-only-password@127.0.0.1:5432/comercialapp_test?schema=public
      COMERCIAL_DB_PASSWORD: ci-only-password
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply test database migrations
        run: npm run db:migrate --workspace @comercialapp/backend

      - name: Build and run tests
        run: npm run check

      - name: Validate Docker Compose files
        run: |
          docker compose -f docker-compose.local.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet

      - name: Validate backup scripts
        run: bash -n deploy/backup-prod.sh deploy/restore-prod.sh
